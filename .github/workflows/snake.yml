name: Generate profile graphics

on:
  schedule:
    # Daily at 00:23 UTC (05:53 IST); GitHub may delay scheduled runs.
    - cron: '23 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/snake.yml'
      - 'scripts/generate_activity.py'

permissions:
  contents: read

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Read the chart generator
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate activity graphs from GitHub data
        run: python3 scripts/generate_activity.py
        env:
          PROFILE_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake.svg?color_snake=%23059669
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%235EEAD4

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
          jekyll: false
          commit_message: Update contribution graph and snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
